services:
  postgres:
    image: postgres:15-alpine
    container_name: workeasy-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: workeasy
      POSTGRES_USER: workeasy
      POSTGRES_PASSWORD: workeasy123
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workeasy -d workeasy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
